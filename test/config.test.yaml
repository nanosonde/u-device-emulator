controller_url: http://127.0.0.1:8080/inform
state_file: data/device_state.test.json
persist: true
verbose: true

defaults:
  device_ip: 192.0.2.10
  interval: 5
  aes_mode: cbc
  firmware: "6.6.61.14919"
  post_adopt_keepalive: true
  post_adopt_interval: 5
  handshake_mode: true

services:
  discovery: both
  discovery_target: 127.0.0.1
  discovery_packet_type: 0x02
  stun: true
  stun_server: true
  ssh: false
  health: false

# Topology: declare how devices are physically connected.
# Each entry says "device X plugs into uplink_device Y on port uplink_port".
# The daemon populates uplink.uplink_mac/uplink_remote_port on the child and
# downlink_table on the parent so the controller topology view renders the tree.
topology:
  - device: lab-switch-01
    uplink_device: lab-gw-01
    uplink_port: 2          # LAN port on the gateway
    local_port: 1           # uplink port on the switch itself
  - device: lab-ap-01
    uplink_device: lab-switch-01
    uplink_port: 5          # switch port where AP is plugged in
    local_port: 1           # AP's own uplink port (eth0)

devices:
  - name: lab-switch-01
    type: switch
    model: US24
    mac: 02:15:6d:aa:00:01
    handshake_mode: true

  - name: lab-ap-01
    type: access_point
    model: U7P
    mac: 02:15:6d:aa:00:02
    handshake_mode: true

  - name: lab-gw-01
    type: gateway
    model: UGW3
    mac: 02:15:6d:aa:00:03
    handshake_mode: true
